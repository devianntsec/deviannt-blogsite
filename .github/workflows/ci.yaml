name: CI (build + guardas CSS, sin deploy)

# No publica nada: solo valida. El deploy sigue siendo deploy.yaml (push a master).
on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  css-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - name: Trinquete de !important (falla si sube)
        run: node scripts/count-important.mjs
      - name: Stylelint (avisos, no bloquea)
        run: npx stylelint "assets/css/**/*.{scss,css}" || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, submodules: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "^1.24.2" }
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with: { hugo-version: "0.159.1", extended: true }
      - run: sudo snap install dart-sass
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: npm run vendor-assets
      - name: Build (valida que compila; no se sube)
        run: hugo --gc --baseURL "http://localhost/"
